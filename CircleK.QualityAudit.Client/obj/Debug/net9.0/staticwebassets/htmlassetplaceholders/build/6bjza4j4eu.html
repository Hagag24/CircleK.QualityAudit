    <base href="/" />
    <script>
        (function () {
            var culture = localStorage.getItem('blazorCulture') || 'ar-EG';
            var dir = culture.toLowerCase().startsWith('ar') ? 'rtl' : 'ltr';
            window.__ck_dir = dir;
            document.documentElement.setAttribute('dir', dir);
            document.documentElement.setAttribute('lang', dir === 'rtl' ? 'ar' : 'en');
            if (document.body) {
                document.body.setAttribute('dir', dir);
            } else {
                document.addEventListener('DOMContentLoaded', function () {
                    document.body.setAttribute('dir', dir);
                });
            }
        })();
    </script>
    
    <script>
        function applyBootstrapDir(dir) {
            var link = document.getElementById('bootstrap-css');
            if (!link) return;
            link.href = dir === 'rtl'
                ? 'lib/bootstrap/dist/css/bootstrap.rtl.min.css'
                : 'lib/bootstrap/dist/css/bootstrap.min.css';
        }
    </script>
    <link id="bootstrap-css" rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <script>
        applyBootstrapDir(window.__ck_dir || 'ltr');
