<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircleK.QualityAudit.Client</title>
    <base href="/" />
    <script>
        (function () {
            var culture = localStorage.getItem('blazorCulture') || 'ar-EG';
            var dir = culture.toLowerCase().startsWith('ar') ? 'rtl' : 'ltr';
            window.__ck_dir = dir;
            document.documentElement.setAttribute('dir', dir);
            document.documentElement.setAttribute('lang', dir === 'rtl' ? 'ar' : 'en');
            if (document.body) {
                document.body.setAttribute('dir', dir);
            } else {
                document.addEventListener('DOMContentLoaded', function () {
                    document.body.setAttribute('dir', dir);
                });
            }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <script>
        function applyBootstrapDir(dir) {
            var link = document.getElementById('bootstrap-css');
            if (!link) return;
            link.href = dir === 'rtl'
                ? 'lib/bootstrap/dist/css/bootstrap.rtl.min.css'
                : 'lib/bootstrap/dist/css/bootstrap.min.css';
        }
    </script>
    <link id="bootstrap-css" rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <script>
        applyBootstrapDir(window.__ck_dir || 'ltr');
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="_content/Blazor.Bootstrap/blazor.bootstrap.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CircleK.QualityAudit.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_content/Blazor.Bootstrap/blazor.bootstrap.js"></script>
    <script>
        window.blazorCulture = {
            get: () => localStorage.getItem('blazorCulture'),
            set: (value) => localStorage.setItem('blazorCulture', value)
        };
        window.blazorDir = {
            set: (dir) => {
                document.documentElement.setAttribute('dir', dir);
                document.documentElement.setAttribute('lang', dir === 'rtl' ? 'ar' : 'en');
                if (document.body) {
                    document.body.setAttribute('dir', dir);
                }
                applyBootstrapDir(dir);
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
